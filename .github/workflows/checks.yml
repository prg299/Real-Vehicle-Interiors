name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source, metadata, links and shader recipes
        run: python scripts/check-repository.py
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check optional Viewpoint camera contract
        shell: pwsh
        run: ./scripts/check-viewpoint.ps1
